name: CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AeroVM Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/aerovm.exe dist/
          Copy-Item run.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath AeroVM-Windows-x64-v0.1.0.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroVM-Windows-x64
          path: dist/

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "AeroVM v0.1.0 (Windows x64 - UTM Style)"
          body: |
            ## 🚀 AeroVM v0.1.0 - Trình Quản Lý Máy Ảo Phong Cách UTM Cho Windows

            ### 📦 Gói phát hành:
            * **AeroVM-Windows-x64-v0.1.0.zip**: Gồm `aerovm.exe`, `run.bat` và hướng dẫn sử dụng.

            ### 💡 Điểm đặc biệt:
            * File thực thi `aerovm.exe` được viết 100% bằng **Rust thuần**, kích thước siêu nhẹ chỉ **~2.1 MB** (khi nén zip còn **~760 KB**), tiêu tốn cực ít tài nguyên RAM (< 15 MB).
            * Hỗ trợ tăng tốc phần cứng **Windows Hypervisor Platform (WHPX)** và CPU `max` cho hiệu năng tiệm cận máy thật.
            * Giao diện kính mờ Dark Glassmorphism chuẩn phong cách **UTM (macOS)**.
            * Nhấp đúp vào **`run.bat`** hoặc **`aerovm.exe`** để mở ngay ứng dụng!
          files: AeroVM-Windows-x64-v0.1.0.zip
