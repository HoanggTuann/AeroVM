name: CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AeroVM Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/aerovm.exe dist/
          Copy-Item run.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath AeroVM-Windows-x64-v0.1.1.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroVM-Windows-x64
          path: dist/

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: "AeroVM v0.1.1 (Windows x64 - Fix WHPX & SliTaz)"
          body: |
            ## 🚀 AeroVM v0.1.1 - Bản vá lỗi WHPX & Hỗ trợ SliTaz Linux

            ### 🛠️ Các sửa đổi quan trọng:
            * **Sửa lỗi `WHPX: Unexpected VP exit code 4`**: Chuyển tham số CPU từ `-cpu max` sang `-cpu qemu64` tương thích 100% với Windows Hypervisor Platform mà không bị crash hypervisor.
            * **Sửa lỗi màn hình đen `Display output is not active`**: Chuyển sang `-vga std` để hiển thị đồ họa BIOS/ISOLINUX/Linux ngay từ giây đầu tiên.
            * **Tích hợp sẵn mẫu SliTaz GNU/Linux Live**: Đã hỗ trợ chạy trực tiếp các bản Live Linux nhẹ như SliTaz mà không cần cài đặt.
            * **Tính năng Gắn / Đổi ISO**: Cho phép thêm hoặc đổi file ISO trực tiếp từ giao diện dashboard.

            ### 📦 Tệp đính kèm:
            * **`AeroVM-Windows-x64-v0.1.1.zip`**: Bao gồm `aerovm.exe`, `run.bat` và hướng dẫn sử dụng.
          files: AeroVM-Windows-x64-v0.1.1.zip
