name: CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AeroVM Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/aerovm.exe dist/
          Copy-Item run.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath AeroVM-Windows-x64-v0.1.2.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroVM-Windows-x64
          path: dist/

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: "AeroVM v0.1.2 (Windows x64 - SDL Display & Engine Toggle)"
          body: |
            ## 🚀 AeroVM v0.1.2 - Native SDL Display & Bộ Chuyển Đổi Engine

            ### 🛠️ Các cải tiến cốt lõi:
            * **Cửa sổ Native SDL Display**: Chuyển toàn bộ hiển thị sang bộ dựng hình **SDL DirectX/Win32 Native**. Khắc phục triệt để tình trạng cửa sổ GTK bị màn hình đen hoặc báo `Guest has not initialized the display (yet)`. Màn hình boot, logo, console và desktop hiển thị tức thì.
            * **Nút chuyển đổi WHPX ⚡ / TCG 🐢 trực tiếp trên giao diện**:
              * **⚡ WHPX (Phần cứng)**: Tối ưu cho Windows 10/11, Ubuntu 24.04, Android.
              * **🐢 TCG (Mô phỏng tương thích)**: Tương thích 100% cho SliTaz, Linux cổ, DOS... không bị lỗi ngắt timer hay MSI injection.
            * **Mẫu SliTaz GNU/Linux Live**: Mặc định cấu hình sẵn chế độ TCG và SDL, bấm Khởi động là chạy ngay lập tức.
            * **Sửa lỗi tên máy ảo có ký tự đặc biệt**: Tự động chuẩn hóa tên ổ đĩa ảo tránh lỗi đường dẫn file.

            ### 📦 Gói phát hành:
            * **`AeroVM-Windows-x64-v0.1.2.zip`**: Bao gồm `aerovm.exe`, `run.bat` và hướng dẫn.
          files: AeroVM-Windows-x64-v0.1.2.zip
