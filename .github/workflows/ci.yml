name: CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AeroVM Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/aerovm.exe dist/
          Copy-Item install.bat dist/
          Copy-Item uninstall.bat dist/
          Copy-Item run.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath AeroVM-Windows-x64-v0.1.4.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroVM-Windows-x64
          path: dist/

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          name: "AeroVM v0.1.4 (Windows x64 - Hotfix ERR_CONNECTION_REFUSED & Modular CSS Studio)"
          body: |
            ## 🚀 AeroVM v0.1.4 - Khắc Phục Lỗi Kết Nối & Tách Bộ Giao Diện CSS Độc Lập

            ### 🛠️ Các cải tiến & Vá lỗi quan trọng:
            * **🔥 Khắc phục triệt để lỗi `127.0.0.1 refused to connect` (`ERR_CONNECTION_REFUSED`)**:
              * **Nguyên nhân**: Do tính năng Startup Boost của Microsoft Edge, tiến trình launcher chuyển tiếp sang background service của Windows và báo kết thúc tiến trình sau 0.05s. Đoán nhầm người dùng tắt cửa sổ nên AeroVM tự đóng server trước khi trình duyệt kịp kết nối.
              * **Giải pháp**: Loại bỏ cơ chế wait tiến trình trình duyệt, chuyển sang quản lý vòng đời ứng dụng độc lập với hồ sơ riêng biệt `--user-data-dir` và cơ chế heartbeat `navigator.sendBeacon`. Server luôn duy trì ổn định 100%, mở app là vào ngay giao diện.
            * **🎨 Chuyển giao diện sang CSS độc lập (`style.css` & `app.js`)**:
              * Tách toàn bộ mã giao diện thành file CSS riêng biệt (`style.css`) và Javascript (`app.js`).
              * Áp dụng hệ thống thiết kế Dark Glassmorphism chuẩn phong cách UTM Studio macOS: mờ Acrylic, tab điều hướng mượt mà, công tắc iOS toggle, phản hồi tức thì.
            * **⚙️ Chuyển đổi và chỉnh sửa cài đặt máy ảo linh hoạt**:
              * Bảng điều khiển cài đặt toàn diện: Chuyển đổi Engine (WHPX ⚡ / TCG 🔄), nhân CPU, RAM (256MB - 16GB), bo mạch, card đồ họa VGA, âm thanh và file ISO.
            * **🐢 Chế độ máy cấu hình yếu (Low-Spec Mode)**:
              * Giảm tải tài nguyên tối đa cho các máy tính cấu hình yếu, tránh treo đơ hoặc dừng máy ảo giữa chừng.
            * **📦 Trình cài đặt tự động (`install.bat`)**:
              * Cài đặt vào thư mục riêng `%LOCALAPPDATA%\Programs\AeroVM`, tạo Shortcut Desktop mở trực tiếp 0 cửa sổ console cmd.

            ### 📦 Gói cài đặt phát hành:
            * **`AeroVM-Windows-x64-v0.1.4.zip`**: Bao gồm `install.bat`, `uninstall.bat`, `aerovm.exe`, `run.bat` và hướng dẫn.
          files: AeroVM-Windows-x64-v0.1.4.zip
