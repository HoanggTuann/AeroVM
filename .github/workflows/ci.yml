name: CI & Release Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AeroVM Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/aerovm.exe dist/
          Copy-Item install.bat dist/
          Copy-Item uninstall.bat dist/
          Copy-Item run.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath AeroVM-Windows-x64-v0.1.5.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroVM-Windows-x64
          path: dist/

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: "AeroVM v0.1.5 - Pure Native Win32 Desktop App (No Browser, No Web Server, Native GUI)"
          body: |
            ## 🚀 AeroVM v0.1.5 - Ứng Dụng Desktop Native 100% (Hoàn Toàn Không Dùng Trình Duyệt / Localhost)

            ### 🌟 Các cải tiến & tính năng đột phá:
            * **🖥️ Chuyển đổi 100% sang Giao diện Native Win32/DirectX Desktop**:
              * Loại bỏ hoàn toàn máy chủ nội bộ localhost (`127.0.0.1:45678`) và cửa sổ trình duyệt Edge/Chrome.
              * Ứng dụng chạy trực tiếp thành cửa sổ Windows Native độc lập chuẩn UTM, khung viền Windows chuẩn (không dùng 3 nút chấm tròn macOS).
              * Hỗ trợ chuẩn tiếng Việt Segoe UI sắc nét, mượt mà trên nền tảng eframe / egui và Hardware Acceleration.
            * **❌ Nút "Thoát" chuyên biệt trong Cài đặt Máy ảo**:
              * Thêm nút `❌ Thoát` góc trên và `❌ Thoát (Không lưu)` dưới cùng màn hình Cài đặt, cho phép đóng bảng cài đặt và quay lại màn hình chính bất cứ lúc nào.
            * **💾 Lưu & Cập nhật Cài đặt tức thì**:
              * Sửa lỗi lưu cấu hình máy ảo (`config.json`), lưu các thông số nhân CPU, RAM, card đồ họa, chipset và file ISO chuẩn xác.
            * **⚡ Tối ưu WHPX & TCG chống lỗi thoát VP exit code 4**:
              * Thiết lập `kernel-irqchip=off` cho WHPX giúp chạy ổn định trên các CPU đời cũ không bị ngắt quãng giữa chừng.
              * Chế độ máy yếu (Low-spec mode) và TCG cho phép chạy mượt mà ngay cả trên máy cấu hình khiêm tốn.

            ### 📦 Gói cài đặt:
            * **`AeroVM-Windows-x64-v0.1.5.zip`**: Giải nén và chạy `install.bat` để tạo shortcut Desktop và sử dụng ngay lập tức!
          files: AeroVM-Windows-x64-v0.1.5.zip
